name: Next.js Frontend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker compose build

      - name: Run Tests
        run: docker compose run --rm onlypays-web-app npm run test

      - name: Cleanup Test Containers
        if: always()
        run: docker compose down --volumes --remove-orphans